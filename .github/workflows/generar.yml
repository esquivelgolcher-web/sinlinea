name: Generar borradores

# Cada 3 horas, a mano desde "Actions", y al subir cambios de código.
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "posts/**"
      - "data/**"
      - "public/img/**"
      - "README.md"
      - "GUIA.md"
      - "docs/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sinlinea
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Caché de Chromium
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Instalar dependencias del sistema para Chromium
        run: npx playwright install-deps chromium

      - name: Generar borradores
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/generar.mjs

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "sinlinea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts public/img public/ilus data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "generar: $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git pull --rebase && git push; then break; fi
              if [ "$i" = 3 ]; then echo "No se pudo hacer push tras 3 intentos"; exit 1; fi
              sleep 5
            done
          fi

      - name: Construir el sitio
        run: node src/build.mjs

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: generar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
