name: Probar Instagram

# Manual. Comprueba que la credencial de una cuenta pertenece al usuario esperado (usuario e id numérico)
# llamando a la API y registra el estado de conexión (data/<cuenta>/conexion.json) y la caducidad real del
# token (o "desconocida") en data/<cuenta>/token-info.json. No publica nada.
# Fase 2: un job por cuenta; cada job recibe solo las credenciales de su cuenta (Environment cuenta-<id> o, en modo
# actual, el secreto de repositorio con el nombre declarado). Con `cuenta` vacío se prueban todas las activas.
on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: "Id de la cuenta a probar (vacío = todas las cuentas activas)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sinlinea
  cancel-in-progress: false

jobs:
  cuentas:
    name: Cuentas activas
    runs-on: ubuntu-latest
    outputs:
      entorno: ${{ steps.lista.outputs.entorno }}
      repositorio: ${{ steps.lista.outputs.repositorio }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Con --comprobar-entornos consulta la API de GitHub (solo metadatos, con GH_PAT: permiso Environments: lectura)
      # y anota si el Environment de cada cuenta en modo Environment tiene sus dos secretos.
      - name: Listar las cuentas a probar por origen de credenciales y comprobar sus Environments
        id: lista
        env:
          CUENTA: ${{ inputs.cuenta }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$CUENTA" ]; then
            node src/cuentas-activas.mjs --cuenta "$CUENTA" --comprobar-entornos >> "$GITHUB_OUTPUT"
          else
            node src/cuentas-activas.mjs --comprobar-entornos >> "$GITHUB_OUTPUT"
          fi

  probar-entorno:
    name: Probar (Environment)
    needs: cuentas
    if: ${{ needs.cuentas.outputs.entorno != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.cuentas.outputs.entorno) }}
    environment: ${{ matrix.entorno }}
    env:
      CUENTA: ${{ matrix.cuenta }}
      ENTORNO: ${{ matrix.entorno }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Comprobado en el job anterior con la API de GitHub (solo metadatos): el Environment exacto cuenta-<id> debe tener
      # IG_ACCESS_TOKEN e IG_USER_ID. Si falta alguno o no hubo permiso para comprobarlo, se falla aquí, antes de
      # contactar con Instagram, y no se usa ningún secreto de otro origen.
      - name: Comprobar que el Environment de la cuenta está completo
        env:
          COMPLETO: ${{ matrix.completo }}
          MOTIVO: ${{ matrix.motivo }}
        run: |
          if [ "$COMPLETO" != "true" ]; then
            echo "::error::Cuenta $CUENTA (Environment $ENTORNO): $MOTIVO"
            exit 1
          fi
          echo "Cuenta $CUENTA: Environment $ENTORNO completo (IG_ACCESS_TOKEN, IG_USER_ID)."

      - name: Comprobar la identidad de la credencial
        run: node src/probar-instagram.mjs --cuenta "$CUENTA" --por-cuenta

      # Se guarda también cuando la prueba falla: data/<cuenta>/conexion.json deja el estado (error o credenciales
      # pendientes) que muestra el panel maestro. Nunca contiene valores de secretos.
      - name: Guardar el estado de conexión y la caducidad comprobada
        if: always()
        run: |
          git config user.name "sinlinea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "conexión ($CUENTA): comprobada $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase && git push; then break; fi
              if [ "$i" = 3 ]; then echo "No se pudo hacer push tras 3 intentos"; exit 1; fi
              sleep 5
            done
          fi

  probar-repositorio:
    name: Probar (modo actual)
    needs: [cuentas, probar-entorno]
    if: ${{ always() && needs.cuentas.result == 'success' && needs.cuentas.outputs.repositorio != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.cuentas.outputs.repositorio) }}
    env:
      CUENTA: ${{ matrix.cuenta }}
      IG_ACCESS_TOKEN: ${{ secrets[matrix.tokenSecreto] }}
      IG_USER_ID: ${{ secrets[matrix.usuarioIdSecreto] }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar la identidad de la credencial
        run: node src/probar-instagram.mjs --cuenta "$CUENTA" --por-cuenta

      - name: Guardar el estado de conexión y la caducidad comprobada
        if: always()
        run: |
          git config user.name "sinlinea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "conexión ($CUENTA): comprobada $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase && git push; then break; fi
              if [ "$i" = 3 ]; then echo "No se pudo hacer push tras 3 intentos"; exit 1; fi
              sleep 5
            done
          fi
