name: Probar Instagram

# Manual. Comprueba que la credencial de una cuenta pertenece al usuario esperado
# (usuario e id numérico) llamando a la API y registra la caducidad real del token (o "desconocida")
# en data/<cuenta>/token-info.json. No publica nada.
on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: "Id de la cuenta a probar (vacío = todas las que tengan secretos)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar la identidad de la credencial
        env:
          CUENTA: ${{ inputs.cuenta }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESSTOKEN_LUISESKIVELGOLCHER: ${{ secrets.IG_ACCESSTOKEN_LUISESKIVELGOLCHER }}
          IG_USER_ID_LUISESKIVELGOLCHER: ${{ secrets.IG_USER_ID_LUISESKIVELGOLCHER }}
        run: node src/probar-instagram.mjs --cuenta "$CUENTA"

      # Se guarda también cuando la prueba falla: data/<cuenta>/conexion.json deja el estado (error o
      # credenciales pendientes) que muestra el panel maestro. Nunca contiene valores de secretos.
      - name: Guardar el estado de conexión y la caducidad comprobada
        if: always()
        run: |
          git config user.name "sinlinea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "conexión: comprobada $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase && git push; then break; fi
              if [ "$i" = 3 ]; then echo "No se pudo hacer push tras 3 intentos"; exit 1; fi
              sleep 5
            done
          fi
