name: Probar Instagram

# Manual. Comprueba que la credencial de una cuenta pertenece al usuario esperado
# (usuario e id numérico) llamando a la API. No publica nada y no escribe en el repositorio.
on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: "Id de la cuenta a probar (vacío = todas las que tengan secretos)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar la identidad de la credencial
        env:
          CUENTA: ${{ inputs.cuenta }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_LUISESKIVELGOLCHER: ${{ secrets.IG_ACCESS_TOKEN_LUISESKIVELGOLCHER }}
          IG_USER_ID_LUISESKIVELGOLCHER: ${{ secrets.IG_USER_ID_LUISESKIVELGOLCHER }}
        run: node src/probar-instagram.mjs --cuenta "$CUENTA"
