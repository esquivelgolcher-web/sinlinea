name: Renovar token de Instagram

# Cada lunes a las 9:00 de Panamá (14:00 UTC). El token dura 60 días.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sinlinea
  cancel-in-progress: false

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar que existe el secreto GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Falta el secreto GH_PAT (token fino con permiso Secrets: lectura y escritura). Sin él no se puede guardar el token renovado, así que no se pide uno nuevo. Ver docs/CONFIGURACION.md §5."
            exit 1
          fi
          echo "GH_PAT presente."

      - name: Pedir un token nuevo
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node src/renovar-token.mjs

      - name: Actualizar el secreto IG_ACCESS_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < temp/nuevo-token.txt
          rm -f temp/nuevo-token.txt

      - name: Guardar la fecha de vencimiento
        run: |
          git config user.name "sinlinea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/token-info.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "token: renovado $(date -u '+%Y-%m-%d')"
            for i in 1 2 3; do
              if git pull --rebase && git push; then break; fi
              if [ "$i" = 3 ]; then echo "No se pudo hacer push tras 3 intentos"; exit 1; fi
              sleep 5
            done
          fi
