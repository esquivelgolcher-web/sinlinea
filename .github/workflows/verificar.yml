name: Verificar configuración y secretos

# Manual. Comprueba config.json, los archivos necesarios y qué secretos existen.
# Solo imprime nombres y estados; nunca valores. No escribe en el repositorio.
# Fase 2: el job "verificar" comprueba lo compartido (configuración, archivos, claves de Claude y Gemini, GH_PAT);
# un job por cuenta comprueba las credenciales de Instagram de esa cuenta en su origen (Environment o repositorio).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Configuración y secretos compartidos
    runs-on: ubuntu-latest
    outputs:
      entorno: ${{ steps.lista.outputs.entorno }}
      repositorio: ${{ steps.lista.outputs.repositorio }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar configuración, archivos y secretos compartidos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node src/verificar.mjs --solo-compartido

      # Con --comprobar-entornos consulta la API de GitHub (solo metadatos, con GH_PAT: permiso Environments: lectura)
      # y anota si el Environment de cada cuenta en modo Environment tiene sus dos secretos.
      - name: Listar las cuentas activas por origen de credenciales y comprobar sus Environments
        id: lista
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node src/cuentas-activas.mjs --comprobar-entornos >> "$GITHUB_OUTPUT"

  verificar-entorno:
    name: Credenciales (Environment)
    needs: verificar
    if: ${{ always() && needs.verificar.outputs.entorno != '' && needs.verificar.outputs.entorno != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.verificar.outputs.entorno) }}
    environment: ${{ matrix.entorno }}
    env:
      CUENTA: ${{ matrix.cuenta }}
      ENTORNO: ${{ matrix.entorno }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Comprobado en el job anterior con la API de GitHub (solo metadatos): el Environment exacto cuenta-<id> debe tener
      # IG_ACCESS_TOKEN e IG_USER_ID. Si falta alguno o no hubo permiso para comprobarlo, se falla aquí, antes de
      # contactar con Instagram, y no se usa ningún secreto de otro origen.
      - name: Comprobar que el Environment de la cuenta está completo
        env:
          COMPLETO: ${{ matrix.completo }}
          MOTIVO: ${{ matrix.motivo }}
        run: |
          if [ "$COMPLETO" != "true" ]; then
            echo "::error::Cuenta $CUENTA (Environment $ENTORNO): $MOTIVO"
            exit 1
          fi
          echo "Cuenta $CUENTA: Environment $ENTORNO completo (IG_ACCESS_TOKEN, IG_USER_ID)."

      - name: Verificar las credenciales de la cuenta
        run: node src/verificar.mjs --cuenta "$CUENTA" --por-cuenta

  verificar-repositorio:
    name: Credenciales (modo actual)
    needs: [verificar, verificar-entorno]
    if: ${{ always() && needs.verificar.outputs.repositorio != '' && needs.verificar.outputs.repositorio != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.verificar.outputs.repositorio) }}
    env:
      CUENTA: ${{ matrix.cuenta }}
      IG_ACCESS_TOKEN: ${{ secrets[matrix.tokenSecreto] }}
      IG_USER_ID: ${{ secrets[matrix.usuarioIdSecreto] }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar las credenciales de la cuenta
        run: node src/verificar.mjs --cuenta "$CUENTA" --por-cuenta
