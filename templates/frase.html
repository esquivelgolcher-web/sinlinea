<!doctype html>
<html lang="es" data-version="1">
<head>
<meta charset="utf-8">
<base href="__BASE__">
<title>Frase</title>
<style>
  /* Tarjeta tipográfica de una frase célebre (formato "frase"): fondo claro de la cuenta, comilla grande en el color
     principal, la frase en el color oscuro, autor en el color de acento. Sin ilustración: la tipografía es la imagen. */
  @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
  :root { --principal: #500014; --acento: #C8A45D; --oscuro: #202020; --claro: #F5F0E6; --margen: 84px; --logo-tamano: 96px; }
  html, body { margin: 0; padding: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; font-family: "Inter", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .frase { position: relative; width: 1080px; height: 1350px; box-sizing: border-box; overflow: hidden; background: var(--claro); color: var(--oscuro); }
  /* Marco fino en el color principal: el gesto de una tarjeta impresa. */
  .frase::before { content: ""; position: absolute; inset: 36px; border: 3px solid var(--principal); pointer-events: none; }
  .cabecera { position: absolute; top: var(--margen); left: var(--margen); right: var(--margen); display: flex; justify-content: space-between; align-items: center; }
  .logo { width: var(--logo-tamano); height: var(--logo-tamano); border-radius: 50%; object-fit: cover; display: block; }
  .logo-fallback { width: var(--logo-tamano); height: var(--logo-tamano); border-radius: 50%; box-sizing: border-box; background: var(--principal); color: var(--claro);
                   display: flex; align-items: center; justify-content: center; font-family: "Anton", Impact, sans-serif; font-size: calc(var(--logo-tamano) * 0.37); line-height: 1; letter-spacing: 0.04em; }
  .frase[data-logo-forma="cuadrado"] .logo, .frase[data-logo-forma="cuadrado"] .logo-fallback { border-radius: 0; }
  .usuario { font-size: 26px; font-weight: 600; color: var(--principal); letter-spacing: 0.02em; }
  /* Cuerpo: comilla, frase, regla, autor y fuente, centrados verticalmente entre cabecera y pie. */
  .cuerpo { position: absolute; left: var(--margen); right: var(--margen); top: 230px; bottom: 170px; display: flex; flex-direction: column; justify-content: center; gap: 0; }
  .comilla { font-family: "Anton", Impact, sans-serif; font-size: 300px; line-height: 0.62; height: 150px; color: var(--principal); margin-left: -12px; }
  .texto { margin: 0; font-weight: 600; font-size: 60px; line-height: 1.25; color: var(--oscuro); overflow-wrap: normal; word-break: normal; hyphens: none; letter-spacing: -0.01em; }
  .regla { width: 140px; height: 5px; background: var(--acento); margin: 44px 0 30px; }
  .autor { margin: 0; font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: 46px; line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; color: var(--principal); }
  .fuente { margin: 10px 0 0; font-size: 27px; line-height: 1.3; color: var(--oscuro); opacity: 0.72; }
  .fuente:empty { display: none; }
  .pie { position: absolute; left: var(--margen); right: var(--margen); bottom: 70px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: var(--oscuro); opacity: 0.6; }
  .pie span:empty { display: none; }
</style>
</head>
<body>
<div class="frase" id="frase">
  <header class="cabecera">
    <div id="logo"></div>
    <div class="usuario" id="usuario"></div>
  </header>
  <main class="cuerpo">
    <div class="comilla">“</div>
    <p class="texto" id="texto"></p>
    <div class="regla"></div>
    <p class="autor" id="autor"></p>
    <p class="fuente" id="fuente"></p>
  </main>
  <footer class="pie">
    <span id="nota"></span>
    <span id="serie"></span>
  </footer>
</div>
<script id="datos" type="application/json">{}</script>
<script>
(async function () {
  const d = JSON.parse(document.getElementById("datos").textContent || "{}");
  const $ = (id) => document.getElementById(id);
  for (const [variable, valor] of [["--principal", d.colores?.principal], ["--acento", d.colores?.acento], ["--oscuro", d.colores?.oscuro], ["--claro", d.colores?.claro]]) {
    if (valor) document.documentElement.style.setProperty(variable, valor);
  }
  $("frase").dataset.logoForma = d.logoForma || "circulo";
  document.documentElement.style.setProperty("--logo-tamano", `${Math.min(Number(d.logoTamano) || 96, 110)}px`);
  $("usuario").textContent = d.usuario || "";
  $("texto").textContent = d.frase || "";
  $("autor").textContent = d.autor || "";
  $("fuente").textContent = [d.fuente, d.anio].filter(Boolean).join(" · ");
  $("nota").textContent = d.nota || "";
  $("serie").textContent = d.serie || "";
  if (d.logoUrl) {
    const img = new Image();
    img.className = "logo"; img.alt = ""; img.src = d.logoUrl;
    $("logo").replaceWith(img);
    await img.decode().catch(() => {});
  } else {
    $("logo").className = "logo-fallback";
    $("logo").textContent = d.iniciales || "?";
  }
  await document.fonts.ready;
  // La frase baja de 60 a 36 px hasta caber en 10 líneas sin cortar palabras; si aun así no cabe, la pieza falla con "frase".
  function ajustar(el, { max, min, paso, interlineado, lineas }) {
    let size = max;
    const cabe = () => Math.round(el.scrollHeight / (size * interlineado)) <= lineas && el.scrollWidth <= el.clientWidth + 1;
    el.style.fontSize = size + "px";
    while (!cabe() && size > min) { size -= paso; el.style.fontSize = size + "px"; }
    return cabe();
  }
  const cabe = ajustar($("texto"), { max: 60, min: 36, paso: 2, interlineado: 1.25, lineas: 10 });
  if (!cabe) document.body.dataset.error = "frase";
  document.body.dataset.listo = "1";
})();
</script>
</body>
</html>
