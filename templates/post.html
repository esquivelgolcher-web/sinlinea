<!doctype html>
<html lang="es" data-version="11">
<head>
<meta charset="utf-8">
<base href="__BASE__">
<title>Sin Línea · post</title>
<style>
  @font-face { font-family: "Anton"; src: url("assets/fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
  :root { --amarillo: #FFD400; --rojo: #E30613; --negro: #111111; --blanco: #FFFFFF;
          --margen: 72px; --barra-alto: 70px; --pie-alto: 80px; --cuerpo-abajo: 196px; --logo-tamano: 120px; }
  html, body { margin: 0; padding: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; font-family: "Inter", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .post { position: relative; width: 1080px; height: 1350px; box-sizing: border-box; overflow: hidden;
          background: var(--fondo); color: var(--texto); }
  .post[data-variante="negro"]    { --fondo: var(--negro);    --texto: var(--blanco); --titular: var(--amarillo); --chip-fondo: var(--rojo);  --chip-texto: var(--blanco);   --barra: var(--rojo);  --barra-texto: var(--blanco); }
  .post[data-variante="amarillo"] { --fondo: var(--amarillo); --texto: var(--negro);  --titular: var(--negro);    --chip-fondo: var(--rojo);  --chip-texto: var(--blanco);   --barra: var(--rojo);  --barra-texto: var(--blanco); }
  .post[data-variante="rojo"]     { --fondo: var(--rojo);     --texto: var(--blanco); --titular: var(--blanco);   --chip-fondo: var(--negro); --chip-texto: var(--amarillo); --barra: var(--negro); --barra-texto: var(--amarillo); }
  /* Ilustración de fondo: la mitad superior queda visible; el degradado va de transparente (centro) a negro (abajo). */
  .fondo { position: absolute; inset: 0; display: none; }
  .fondo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fondo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 56%, rgba(0,0,0,0.90) 72%, rgba(0,0,0,0.96) 100%); }
  .post.con-ilustracion { --fondo: var(--negro); --texto: var(--blanco); --titular: var(--amarillo); --chip-fondo: var(--rojo); --chip-texto: var(--blanco); --barra: var(--rojo); --barra-texto: var(--blanco); }
  .post.con-ilustracion .fondo { display: block; }
  .post.con-ilustracion .bajada { opacity: 0.95; }
  .cabecera, .cuerpo, .pie, .barra, .rotulo { position: absolute; z-index: 1; }
  /* Cabecera: logo pequeño arriba a la izquierda, categoría arriba a la derecha. */
  .cabecera { top: var(--margen); left: var(--margen); right: var(--margen); height: 120px; display: flex; justify-content: space-between; align-items: flex-start; }
  .logo { width: var(--logo-tamano); height: var(--logo-tamano); border-radius: 50%; object-fit: cover; display: block; }
  .post[data-variante="amarillo"] .logo { box-shadow: 0 0 0 5px var(--negro); }
  .post.con-ilustracion[data-variante] .logo { box-shadow: none; }
  /* marca.logoForma "cuadrado": el logo (o las iniciales de reserva) no se recorta en círculo. */
  .post[data-logo-forma="cuadrado"] .logo, .post[data-logo-forma="cuadrado"] .logo-fallback { border-radius: 0; }
  .logo-fallback { width: var(--logo-tamano); height: var(--logo-tamano); border-radius: 50%; box-sizing: border-box; background: var(--amarillo); color: var(--negro);
                   display: flex; align-items: center; justify-content: center; font-family: "Anton", Impact, sans-serif; font-size: calc(var(--logo-tamano) * 0.37); line-height: 1; letter-spacing: 0.04em;
                   text-align: center; border: 5px solid var(--negro); }
  .chip { font-weight: 700; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--chip-fondo); color: var(--chip-texto); padding: 12px 20px; margin-top: 6px; }
  .chip:empty { display: none; } /* marca.mostrarCategoria=false: sin etiqueta de sección */
  /* Cuerpo anclado a la mitad inferior: titular de 86 a 70 px (máx. 3 líneas) y bajada de 34 a 30 px (máx. 2 líneas). */
  .cuerpo { left: var(--margen); right: var(--margen); bottom: var(--cuerpo-abajo); display: flex; flex-direction: column; justify-content: flex-end; gap: 28px; }
  /* Sin ilustración (diseño tipográfico) el texto se centra entre la cabecera y el pie. */
  .post:not(.con-ilustracion) .cuerpo { top: 232px; justify-content: center; }
  .titular { margin: 0; font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: 1.0; color: var(--titular);
             font-size: 86px; overflow-wrap: normal; word-break: normal; hyphens: none; }
  .bajada { margin: 0; font-size: 34px; line-height: 1.3; opacity: 0.9; overflow-wrap: normal; word-break: normal; hyphens: none; }
  .bajada:empty { display: none; }
  /* Rótulo, pie y franja: tamaños secundarios. */
  .rotulo { display: none; right: var(--margen); bottom: calc(var(--barra-alto) + var(--pie-alto) + 10px); font-size: 22px; letter-spacing: 0.02em; color: rgba(255,255,255,0.8); }
  .post.con-ilustracion .rotulo { display: block; }
  .post.con-ilustracion .rotulo:empty { display: none; } /* sin texto de rótulo configurado, no se dibuja nada */
  .pie { left: var(--margen); right: var(--margen); bottom: var(--barra-alto); height: var(--pie-alto); display: flex; justify-content: space-between; align-items: center; font-size: 24px; font-weight: 600;
         border-top: 2px solid color-mix(in srgb, var(--texto) 30%, transparent); }
  .barra:empty { display: none; }
  .barra { left: 0; right: 0; bottom: 0; height: var(--barra-alto); background: var(--barra); color: var(--barra-texto);
           display: flex; align-items: center; justify-content: center; font-family: "Anton", Impact, sans-serif; font-size: 32px; letter-spacing: 0.06em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="post" id="post" data-variante="negro">
  <div class="fondo" id="fondo"></div>
  <header class="cabecera">
    <div id="logo"></div>
    <div class="chip" id="categoria"></div>
  </header>
  <main class="cuerpo">
    <h1 class="titular" id="titular"></h1>
    <p class="bajada" id="bajada"></p>
  </main>
  <div class="rotulo" id="rotulo"></div>
  <footer class="pie">
    <span id="fuente"></span>
    <span id="usuario"></span>
  </footer>
  <div class="barra" id="lema"></div>
</div>
<script id="datos" type="application/json">{}</script>
<script>
(async function () {
  const d = JSON.parse(document.getElementById("datos").textContent || "{}");
  const $ = (id) => document.getElementById(id);
  // Colores de la marca de la cuenta (por defecto, la paleta de Sin Línea definida en :root).
  for (const [variable, valor] of [["--amarillo", d.colores?.principal], ["--rojo", d.colores?.acento], ["--negro", d.colores?.oscuro], ["--blanco", d.colores?.claro]]) {
    if (valor) document.documentElement.style.setProperty(variable, valor);
  }
  $("post").dataset.variante = d.variante || "negro";
  $("post").dataset.logoForma = d.logoForma || "circulo";
  document.documentElement.style.setProperty("--logo-tamano", `${Number(d.logoTamano) || 120}px`); // marca.logoTamano por cuenta
  $("categoria").textContent = d.categoria || "";
  $("titular").textContent = d.titular || "";
  $("bajada").textContent = d.bajada || "";
  $("fuente").textContent = d.fecha || "";
  $("usuario").textContent = d.usuario || "";
  $("lema").textContent = d.lema || "";
  if (!d.lema) document.documentElement.style.setProperty("--barra-alto", "0px"); // sin lema, la franja inferior no se dibuja
  if (d.ilustracionUrl) {
    const fondo = new Image();
    fondo.alt = "";
    fondo.src = d.ilustracionUrl;
    $("fondo").replaceChildren(fondo);
    try {
      await fondo.decode();
      $("post").classList.add("con-ilustracion");
      // Sobre la ilustración el fondo es oscuro: el titular usa el color de marca que se lee bien ahí (lib/render.mjs).
      if (d.titularIlustracion) $("post").style.setProperty("--titular", d.titularIlustracion);
      $("rotulo").textContent = d.rotulo || "";
    } catch { /* la imagen no decodifica: se conserva el post tipográfico, sin clase ni rótulo */ }
  }
  if (d.logoUrl) {
    const img = new Image();
    img.className = "logo";
    img.alt = "";
    img.src = d.logoUrl;
    $("logo").replaceWith(img);
    await img.decode().catch(() => {});
  } else {
    $("logo").className = "logo-fallback";
    $("logo").textContent = d.iniciales || "?";
  }
  await document.fonts.ready;
  // Reduce el tamaño de letra hasta que el texto quepa en las líneas permitidas sin cortar palabras.
  function ajustar(el, { max, min, paso, interlineado, lineas }) {
    let size = max;
    const cabe = () => Math.round(el.scrollHeight / (size * interlineado)) <= lineas && el.scrollWidth <= el.clientWidth + 1;
    el.style.fontSize = size + "px";
    while (!cabe() && size > min) { size -= paso; el.style.fontSize = size + "px"; }
    return cabe();
  }
  const titularCabe = ajustar($("titular"), { max: 86, min: 70, paso: 2, interlineado: 1.0, lineas: 3 });
  const bajadaCabe = ajustar($("bajada"), { max: 34, min: 30, paso: 2, interlineado: 1.3, lineas: 2 });
  if (!titularCabe) document.body.dataset.error = "titular";
  else if (!bajadaCabe) document.body.dataset.error = "bajada";
  document.body.dataset.listo = "1";
})();
</script>
</body>
</html>
